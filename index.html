<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Git Assignment</title>

  <!-- Montserrat: bold geometric font like the Starbucks design -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== NAV: logo on the left, pill centred ========== -->
  <header class="nav">
    <span class="nav__logo">GIT</span>
    <nav class="nav__pill">
      <a href="#home" class="active">Home</a>
      <a href="#team">Team</a>
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <!-- ========== HERO ========== -->
  <section class="hero" id="home">

    <div class="hero__text">
      <p class="hero__small">WHERE EVERY COMMIT TELLS A STORY.</p>
      <h1 class="hero__title">WHAT'S <span>YOURS?</span></h1>
      <p class="hero__desc">
        Four students, one repository, and a shared history of every change
        we make together. (this would be deleted)
      </p>
      <a class="btn" href="#team">Meet the team</a>
    </div>

    <!-- Big rounded panel: video on the left, outlined word on the right -->
    <div class="hero__panel">

      <div class="hero__media">
        <video controls muted loop>
          <source src="images/gitmerge.mp4" type="video/mp4">
          Your browser does not support HTML video.
        </video>
      </div>

      <div class="hero__word" aria-hidden="true">
        <span class="solid">GIT</span>
        <span class="outline">GIT</span>
      </div>

    </div>
  </section>

  <!-- ========== TEAM ========== -->
  <section class="team-section" id="team">

    <h2 class="assignment-title">MCA GIT ASSIGNMENT</h2>
    <h3 class="tab">THE TEAM</h3>

    <div class="team">

    </div>
  </section>

</body>
</html>
